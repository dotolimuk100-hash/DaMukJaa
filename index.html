<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다묵자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #E8830A;
            --bg-color: #FFFFFF;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Nanum Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, .jua-font {
            font-family: 'Jua', sans-serif;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .screen.active {
            display: flex;
        }

        /* 공통 버튼 스타일 */
        button, .btn-label {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            text-align: center;
            display: inline-block;
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
        }

        button:active, .btn-label:active {
            transform: scale(0.95);
            background-color: #cc7308;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .share-btn-x {
            background-color: #000000;
        }
        .share-btn-x:active {
            background-color: #333333;
        }

        /* --- 입력 화면 --- */
        #screen-input {
            justify-content: center;
            gap: 10px; /* 텍스트 간격 조정 */
        }

        .title {
            font-size: 2.8rem;
            color: var(--primary-color);
            margin-bottom: 5px;
            text-align: center;
        }

        /* 추가된 프로필 및 설명 텍스트 스타일 */
        .profile-text {
            color: #888888;
            font-size: 0.95rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .instruction-desc {
            color: #444444;
            font-size: 1.05rem;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
            word-break: keep-all;
        }

        .mode-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }

        .mode-radio { display: none; }
        .mode-label {
            flex: 1;
            padding: 15px 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            font-family: 'Jua', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-radio:checked + .mode-label {
            border-color: var(--primary-color);
            background-color: #fff3e6;
            color: var(--primary-color);
        }

        #image-upload {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }

        .preview-container {
            width: 200px;
            height: 200px;
            border: 2px dashed #ccc;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 5px;
            background-color: #f9f9f9;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .preview-container.dragover {
            background-color: #fff3e6;
            border-color: var(--primary-color);
        }

        #image-preview {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: contain;
        }

        /* --- 게임 화면 --- */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .timer-red { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        @keyframes fast-blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }

        .instruction-text {
            color: #666;
            font-size: 1rem;
            margin-bottom: 5px;
            text-align: center;
        }

        /* 단일 메인 캔버스 영역 */
        .game-area {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4; 
            margin: 0 auto;
            cursor: pointer;
            touch-action: none; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background-color: white; 
        }

        #main-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HTML 기반 녹화 상태 오버레이 (영상에 안 찍힘) */
        #recording-ui {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #rec-status-badge {
            background: rgba(255, 255, 255, 0.85);
            color: red;
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #rec-alert-text {
            margin-top: 15px;
            color: #E8830A;
            font-family: 'Jua', sans-serif;
            font-size: 3rem;
            -webkit-text-stroke: 2px white; 
            text-shadow: 2px 2px 0 #fff;
            animation: fast-blink 0.3s infinite;
        }

        /* 겉단 CSS 진동 */
        .shake-active {
            animation: intense-shake 0.1s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes intense-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 3px) rotate(-1deg); }
            50% { transform: translate(3px, -3px) rotate(1deg); }
            75% { transform: translate(-3px, -3px) rotate(0deg); }
            100% { transform: translate(3px, 3px) rotate(-1deg); }
        }

        /* 시작 전 3초 카운트다운 오버레이 */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 6rem;
            font-family: 'Jua', sans-serif;
            z-index: 100;
        }

        #finish-game-btn { margin-top: 20px; }

        /* --- 결과 화면 --- */
        #screen-result { justify-content: center; }
        .result-count {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 10px 0 20px 0;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: none;
            background-color: #000;
        }
        
        #result-video {
            width: 100%;
            display: block;
        }
        
        #record-error-msg {
            display: none;
            color: #d93025;
            font-size: 0.95rem;
            text-align: left;
            margin-bottom: 15px;
            background-color: #fce8e6;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- 1. 입력 화면 -->
    <div id="screen-input" class="screen active">
        <h1 class="title jua-font">뭐든 먹어드립니다</h1>
        <p class="profile-text jua-font">이름: 콰삭이 / 스펙: 처먹기 경력 베테랑 수준</p>
        <p class="instruction-desc jua-font">학교, 회사, 시험 등...<br>갉아 먹어 주면 좋겠다 싶은 이미지를 넣어주시게.</p>
        
        <div class="mode-selection">
            <input type="radio" name="game-mode" id="mode-infinite" value="infinite" class="mode-radio" checked>
            <label for="mode-infinite" class="mode-label">무한 갉기</label>
            
            <input type="radio" name="game-mode" id="mode-10sec" value="10sec" class="mode-radio">
            <label for="mode-10sec" class="mode-label">10초 챌린지</label>
        </div>

        <div class="preview-container" id="drop-zone">
            <span id="preview-placeholder">여기로 사진을 끌어오거나<br>아래 버튼을 눌러주세요</span>
            <img id="image-preview" src="" alt="미리보기">
        </div>
        
        <label for="image-upload" class="btn-label">사진 선택하기</label>
        <input type="file" id="image-upload" accept="image/*">
        
        <button id="start-btn" disabled>쾁쾁 먹으러 가기</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div id="screen-game" class="screen">
        <div class="instruction-text jua-font">클릭, 터치 또는 스페이스바를 연타하세요!</div>
        <div class="game-header jua-font">
            <div id="timer-display">타이머: --</div>
            <div id="click-count">0번</div>
        </div>

        <div class="game-area" id="game-area">
            <canvas id="main-canvas" width="600" height="800"></canvas>
            
            <!-- 녹화 화면에서 제외되는 HTML 오버레이 UI -->
            <div id="recording-ui">
                <div id="rec-status-badge">🔴 영상 찍는 중! (5초)</div>
                <div id="rec-alert-text">마구 클릭하세요!!</div>
            </div>

            <div id="countdown-overlay">3</div>
        </div>

        <button id="finish-game-btn" style="display: none;">결과 보기 (종료)</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="screen-result" class="screen">
        <h2 class="jua-font">결과 발표!</h2>
        <div class="result-count jua-font" id="final-result-text">--번 처먹었어요!</div>
        
        <div id="record-error-msg"></div>

        <div class="video-container" id="video-container">
            <video id="result-video" controls autoplay loop playsinline muted></video>
        </div>
        
        <button id="save-video-btn" style="display: none; background-color: #FF5A5F;">녹화된 영상 저장하기</button>
        <button id="share-x-btn" class="share-btn-x">𝕏 (Twitter) 공유하기</button>
        <button id="retry-btn" style="background-color: #666;">다시 하기</button>
    </div>

    <script>
        // --- 에셋 로드 ---
        const imgBody = new Image(); imgBody.src = 'assets/rabbit-body.png';
        const imgHeadIdle = new Image(); imgHeadIdle.src = 'assets/rabbit-head-idle.png';
        const imgHeadChomp = new Image(); imgHeadChomp.src = 'assets/rabbit-head-chomp.png';
        
        // 오디오 (마인크래프트 먹방 소리 등)
        const eatSound = new Audio('assets/eat.mp3'); 

        // --- 상태 변수 ---
        let currentMode = 'infinite';
        let userImageObj = new Image();
        let isImageLoaded = false;
        
        let clicks = 0;
        let eatProgress = 0; 
        const MAX_EAT = 200; // 빨리 빨려 들어감
        
        let isPlaying = false;
        let gameTimerInterval = null;
        let gameTimeLeft = 10;
        
        let chompFrames = 0; 
        let floatingTexts = []; 
        let shakeIntensity = 0; // 캔버스 내부 진동 수치
        
        // 티비플 스타일 텍스트
        const popWords = ["다처먹어주마", "쾁쾁쾁", "첩첩첩"];
        const textColors = ["#ffffff", "#ffea00", "#ff6600", "#00ffcc", "#ff99ff"];

        // 영상 녹화 관련 변수
        let mediaRecorder;
        let recordedChunks = [];
        let videoBlobUrl = null;
        let isRecording = false;
        let recTimeLeft = 5; 
        let recInterval = null;
        let animationFrameId = null;

        // --- DOM 요소 ---
        const screenInput = document.getElementById('screen-input');
        const screenGame = document.getElementById('screen-game');
        const screenResult = document.getElementById('screen-result');
        const imageUpload = document.getElementById('image-upload');
        const dropZone = document.getElementById('drop-zone');
        const imagePreview = document.getElementById('image-preview');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const startBtn = document.getElementById('start-btn');
        const modeRadios = document.getElementsByName('game-mode');
        
        const timerDisplay = document.getElementById('timer-display');
        const clickCountDisplay = document.getElementById('click-count');
        const gameArea = document.getElementById('game-area');
        const mainCanvas = document.getElementById('main-canvas');
        const ctx = mainCanvas.getContext('2d');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const recordingUi = document.getElementById('recording-ui');
        const recStatusBadge = document.getElementById('rec-status-badge');
        const finishGameBtn = document.getElementById('finish-game-btn');

        const finalResultText = document.getElementById('final-result-text');
        const resultVideo = document.getElementById('result-video');
        const videoContainer = document.getElementById('video-container');
        const saveVideoBtn = document.getElementById('save-video-btn');
        const recordErrorMsg = document.getElementById('record-error-msg');
        const shareXBtn = document.getElementById('share-x-btn');
        const retryBtn = document.getElementById('retry-btn');

        // --- 이벤트 리스너 ---
        modeRadios.forEach(radio => radio.addEventListener('change', e => currentMode = e.target.value));

        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    imagePreview.src = dataUrl;
                    imagePreview.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                    userImageObj.onload = () => {
                        isImageLoaded = true;
                        startBtn.disabled = false;
                    };
                    userImageObj.src = dataUrl;
                };
                reader.readAsDataURL(file);
            }
        }

        imageUpload.addEventListener('click', e => e.target.value = null);
        imageUpload.addEventListener('change', e => handleFile(e.target.files[0]));
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        startBtn.addEventListener('click', () => {
            if (!isImageLoaded) return;
            
            clicks = 0; eatProgress = 0; floatingTexts = []; recordedChunks = []; videoBlobUrl = null;
            shakeIntensity = 0;
            clickCountDisplay.textContent = '0번';
            finishGameBtn.style.display = 'none';
            recordingUi.style.display = 'none';
            videoContainer.style.display = 'none';
            saveVideoBtn.style.display = 'none';
            recordErrorMsg.style.display = 'none';
            resultVideo.src = '';
            
            showScreen(screenGame);

            countdownOverlay.style.display = 'flex';
            let cd = 3;
            countdownOverlay.textContent = cd;
            
            const cdInterval = setInterval(() => {
                cd--;
                if (cd > 0) {
                    countdownOverlay.textContent = cd;
                } else {
                    clearInterval(cdInterval);
                    countdownOverlay.style.display = 'none';
                    startGameLogic(); 
                }
            }, 1000);
        });

        function startGameLogic() {
            isPlaying = true;
            isRecording = true;
            recTimeLeft = 5; 
            recordingUi.style.display = 'flex';
            recStatusBadge.textContent = `🔴 영상 찍는 중! (5초)`;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();

            try {
                const stream = mainCanvas.captureStream(); 
                let options = { mimeType: 'video/webm' };
                if (MediaRecorder.isTypeSupported('video/webm; codecs=vp9')) {
                    options = { mimeType: 'video/webm; codecs=vp9' };
                } else if (MediaRecorder.isTypeSupported('video/webm; codecs=vp8')) {
                    options = { mimeType: 'video/webm; codecs=vp8' };
                } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/mp4' };
                }

                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = e => { 
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data); 
                };
                mediaRecorder.onstop = () => {
                    setTimeout(() => {
                        try {
                            if (recordedChunks.length === 0) throw new Error("녹화된 프레임이 없습니다.");
                            const blob = new Blob(recordedChunks, { type: options.mimeType });
                            videoBlobUrl = URL.createObjectURL(blob);
                            resultVideo.src = videoBlobUrl;
                            videoContainer.style.display = 'block';
                            saveVideoBtn.style.display = 'inline-block';
                            recordErrorMsg.style.display = 'none';
                        } catch (e) {
                            console.error("비디오 생성 실패:", e);
                            isRecording = false;
                            showRecordingError(e.message);
                        }
                    }, 100);
                };
                mediaRecorder.start(100); 
            } catch (err) {
                console.error("녹화 초기화 실패:", err);
                isRecording = false;
                showRecordingError(err.message);
                recordingUi.style.display = 'none';
            }

            recInterval = setInterval(() => {
                recTimeLeft--;
                if (recTimeLeft > 0) {
                    recStatusBadge.textContent = `🔴 영상 찍는 중! (${recTimeLeft}초)`;
                } else {
                    clearInterval(recInterval);
                    recordingUi.style.display = 'none'; // 5초 뒤 HTML UI 숨김
                    if (isRecording && mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                        isRecording = false;
                    }
                }
            }, 1000);

            if (currentMode === '10sec') {
                gameTimeLeft = 10;
                timerDisplay.textContent = `타이머: ${gameTimeLeft}초`;
                timerDisplay.classList.remove('timer-red');
                gameTimerInterval = setInterval(() => {
                    gameTimeLeft--;
                    timerDisplay.textContent = `타이머: ${gameTimeLeft}초`;
                    if (gameTimeLeft <= 3) timerDisplay.classList.add('timer-red');
                    if (gameTimeLeft <= 0) endGame();
                }, 1000);
            } else {
                timerDisplay.textContent = '타이머: 무한';
                timerDisplay.classList.remove('timer-red');
                finishGameBtn.style.display = 'block'; 
            }
        }

        function showRecordingError(errMsg) {
            recordErrorMsg.style.display = 'block';
            recordErrorMsg.innerHTML = `⚠️ <b>영상 녹화가 차단되었습니다.</b><br>에러 내용: <span style="font-size:0.85em;">${errMsg}</span><br><br>💡 <b>원인 안내:</b> 로컬 파일 환경(file://)이거나 브라우저 권한 문제입니다. GitHub Pages 등에 배포하면 정상 작동합니다.`;
        }

        function triggerChomp() {
            if (!isPlaying) return;
            
            clicks++; eatProgress++;
            clickCountDisplay.textContent = `${clicks}번`;
            if (eatProgress >= MAX_EAT) eatProgress = 0; 

            // 1. 소리 재생
            const soundClone = eatSound.cloneNode();
            soundClone.volume = 0.5;
            soundClone.play().catch(() => {}); 

            // 2. 겉단 CSS 진동
            gameArea.classList.remove('shake-active');
            void gameArea.offsetWidth; 
            gameArea.classList.add('shake-active');
            if (navigator.vibrate) navigator.vibrate(30); 

            // 3. 비디오(캔버스) 내부 진동 강도 증가
            shakeIntensity = 15; 
            chompFrames = 6; 

            // 4. 티비플 스타일 텍스트 스폰
            if (Math.random() < 0.6) {
                let spawnCount = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<spawnCount; i++) {
                    floatingTexts.push({
                        text: popWords[Math.floor(Math.random() * popWords.length)],
                        x: mainCanvas.width + Math.random() * 100, 
                        y: 100 + Math.random() * (mainCanvas.height - 200), 
                        speed: 12 + Math.random() * 10, 
                        color: textColors[Math.floor(Math.random() * textColors.length)]
                    });
                }
            }
        }

        gameArea.addEventListener('pointerdown', e => { e.preventDefault(); triggerChomp(); });
        window.addEventListener('keydown', e => { if (e.code === 'Space' && isPlaying) { e.preventDefault(); triggerChomp(); } });

        function gameLoop() {
            if (!isPlaying && !isRecording) return; 

            const cw = mainCanvas.width;
            const ch = mainCanvas.height;
            
            // 영상 내 지진 효과
            ctx.save();
            if (shakeIntensity > 0) {
                const dx = (Math.random() - 0.5) * shakeIntensity;
                const dy = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(dx, dy);
                shakeIntensity *= 0.85; 
                if (shakeIntensity < 0.5) shakeIntensity = 0;
            }

            // 배경 클리어
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, cw, ch);

            // 티비플 텍스트 그리기
            ctx.textAlign = "left";
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let t = floatingTexts[i];
                ctx.font = "bold 48px Jua";
                ctx.lineWidth = 6;
                ctx.strokeStyle = "rgba(0,0,0,0.8)";
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x, t.y);
                
                t.x -= t.speed; 
                if (t.x < -300) floatingTexts.splice(i, 1); 
            }

            // 토끼 몸통
            ctx.drawImage(imgBody, 0, 0, cw, ch);

            // 사용자 이미지
            const imgRatio = userImageObj.width / userImageObj.height;
            const maxDrawW = cw * 0.55; 
            const maxDrawH = ch * 0.4;  
            let drawW = maxDrawW;
            let drawH = drawW / imgRatio;
            if (drawH > maxDrawH) { drawH = maxDrawH; drawW = drawH * imgRatio; }
            let drawX = (cw - drawW) / 2; 
            let drawY = ch * 0.45; 
            
            // ⭐ 잔상 제거를 위한 이동 거리 추가 보정 (ch * 0.05)
            const moveUpOffset = (drawH + (ch * 0.05)) * (eatProgress / MAX_EAT);
            const activeDrawY = drawY - moveUpOffset;

            ctx.save();
            ctx.beginPath();
            const biteLineY = ch * 0.45; 
            ctx.moveTo(0, biteLineY);
            const segments = 20;
            const segWidth = cw / segments;
            for (let i = 0; i <= segments; i++) {
                const x = i * segWidth;
                const yOffset = (i % 2 === 0) ? (ch * 0.015) : -(ch * 0.015); 
                ctx.lineTo(x, biteLineY + yOffset);
            }
            ctx.lineTo(cw, ch);
            ctx.lineTo(0, ch);
            ctx.closePath();
            ctx.clip(); 
            ctx.drawImage(userImageObj, drawX, activeDrawY, drawW, drawH);
            ctx.restore();

            // 토끼 머리
            if (chompFrames > 0) {
                ctx.drawImage(imgHeadChomp, 0, ch * 0.05, cw, ch);
                chompFrames--;
            } else {
                ctx.drawImage(imgHeadIdle, 0, 0, cw, ch);
            }

            ctx.restore();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameTimerInterval);
            recordingUi.style.display = 'none';
            
            if (isRecording && mediaRecorder && mediaRecorder.state !== "inactive") {
                clearInterval(recInterval);
                mediaRecorder.stop();
                isRecording = false;
            }
            
            const modeText = currentMode === '10sec' ? '10초 챌린지에서' : '무한 갉기 모드에서';
            finalResultText.innerHTML = `${modeText}<br><span style="color: #333; font-size: 3.5rem;">${clicks}번</span><br>처먹었어요!`;
            
            showScreen(screenResult);
        }

        finishGameBtn.addEventListener('click', endGame);
        
        saveVideoBtn.addEventListener('click', () => {
            if (!videoBlobUrl) return;
            const link = document.createElement('a');
            link.download = `뭐든_먹어드립니다_${clicks}.webm`;
            link.href = videoBlobUrl;
            link.click();
        });

        shareXBtn.addEventListener('click', () => {
            const modeText = currentMode === '10sec' ? '10초 동안' : '무한 갉기 모드에서';
            const textToTweet = `뭐든 먹어드립니다!\n${modeText} ${clicks}번 처먹었어요!\n\n#뭐든먹어드립니다 #토끼`;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(textToTweet)}`;
            window.open(twitterUrl, '_blank');
        });

        retryBtn.addEventListener('click', () => showScreen(screenInput));

    </script>
</body>
